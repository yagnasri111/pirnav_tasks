<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <!-- Heading -->
    <h1>Login Page</h1> 
    <form action="submit.html" method="get">
        <dl>
            <dt>
                <label for="email">EMAIL</label>
            </dt>
            <dd>
                <input type="email" id="email" name="email" required placeholder="Enter Email" pattern="[a-z._\d]+@[a-z]+\.[a-z]{2,}" autofocus> 
            </dd>
            <dt>
                <label for="pass">PASSWORD</label>
            </dt>
            <dd>
                <input type="password" id="pass" name="password" required pattern="[a-zA-Z\d@!#$]{8,16}" placeholder="Enter Password" autofocus>
            </dd>
        </dl>
        
        <input id="submit" type="submit" value="Login">
        
    </form>
    </div>
</body>
</html>
